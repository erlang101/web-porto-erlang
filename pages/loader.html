<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Loader Preview — ESG Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --accent-1:#2954FF;
    --accent-2:#7C5CFF;
    --accent-grad: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    --bg:#05060b;
    --bg-elev:#0c0e18;
    --text:#f4f5fb;
    --text-soft:#9aa1bd;
    --border:rgba(244,245,251,0.12);
    --glass:rgba(16,18,30,0.6);
    --font-display:'Space Grotesk', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
    --ease-out: cubic-bezier(.16,1,.3,1);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:var(--font-mono); display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:24px;
  }
  .page-content{ text-align:center; opacity:.6; font-size:14px; color:var(--text-soft); }
  .replay-btn{
    font-family:var(--font-mono); font-size:13px; padding:10px 20px; border-radius:100px;
    border:1px solid var(--border); background:transparent; color:var(--text); cursor:pointer;
  }
  .replay-btn:hover{ border-color:var(--accent-1); color:var(--accent-1); }

  /* ================= LOADER ================= */
  .loader{
    position:fixed; inset:0; z-index:9999;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg);
    transition:opacity .7s var(--ease-out), transform .7s var(--ease-out), visibility .7s;
  }
  .loader.done{
    opacity:0; transform:scale(1.04); pointer-events:none; visibility:hidden;
  }

  .loader-inner{ display:flex; flex-direction:column; align-items:center; gap:26px; }

  /* signature mark: rotating gradient ring + monogram, echoes the site's dot-field / glow-border motif */
  .loader-mark{
    position:relative; width:84px; height:84px;
    display:flex; align-items:center; justify-content:center;
    isolation:isolate;
  }
  .loader-mark::before{
    content:''; position:absolute; inset:0; border-radius:22px;
    background:conic-gradient(from 0deg, var(--accent-1), var(--accent-2), transparent 40%, var(--accent-1));
    animation:spinRing 2.4s linear infinite;
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 8px), #000 calc(100% - 7px));
    mask:radial-gradient(farthest-side, transparent calc(100% - 8px), #000 calc(100% - 7px));
  }
  @keyframes spinRing{ to{ transform:rotate(360deg); } }

  .loader-initials{
    position:relative; z-index:1;
    width:64px; height:64px; border-radius:16px;
    background:var(--glass); border:1px solid var(--border);
    backdrop-filter:blur(10px);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:-0.02em;
    animation:markPulse 2.4s var(--ease-out) infinite;
  }
  @keyframes markPulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.04); }
  }

  .loader-progress{
    width:180px; height:3px; border-radius:100px; background:var(--border); overflow:hidden;
  }
  .loader-progress-bar{
    width:0%; height:100%; border-radius:100px; background:var(--accent-grad);
    box-shadow:0 0 14px rgba(41,84,255,.6);
    transition:width .25s var(--ease-out);
  }

  .loader-meta{
    display:flex; align-items:center; gap:14px;
    font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-soft);
  }
  .loader-percent{
    font-variant-numeric:tabular-nums; color:var(--text); min-width:34px; text-align:right;
  }

  @media (prefers-reduced-motion: reduce){
    .loader-mark::before{ animation:none; }
    .loader-initials{ animation:none; }
    .loader{ transition:opacity .3s ease; }
  }
</style>
</head>
<body>

  <!-- ===== LOADER MARKUP — place as the very first element inside <body> ===== -->
  <div class="loader" id="pageLoader" aria-hidden="true">
    <div class="loader-inner">
      <div class="loader-mark">
        <span class="loader-initials">ES</span>
      </div>
      <div class="loader-progress">
        <div class="loader-progress-bar" id="loaderBar"></div>
      </div>
      <div class="loader-meta">
        <span class="loader-label">memuat portofolio</span>
        <span class="loader-percent" id="loaderPercent">0%</span>
      </div>
    </div>
  </div>
  <!-- ===== end loader markup ===== -->

  <div class="page-content">
    Halaman sudah termuat di belakang loader.<br>
    <button class="replay-btn" onclick="location.reload()">Putar ulang animasi</button>
  </div>

<script>
(function(){
  const loader = document.getElementById('pageLoader');
  if (!loader) return;
  const bar = document.getElementById('loaderBar');
  const percentEl = document.getElementById('loaderPercent');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  document.body.style.overflow = 'hidden';

  let progress = 0;
  let target = 0;
  let rafId;

  function tick(){
    /* creeps forward on its own so it never looks stuck, but never finishes before the page actually has */
    const ceiling = target >= 100 ? 100 : 92;
    progress += (ceiling - progress) * 0.06 + 0.1;
    progress = Math.min(progress, ceiling);
    bar.style.width = progress + '%';
    percentEl.textContent = Math.floor(progress) + '%';
    if (progress < 100){ rafId = requestAnimationFrame(tick); }
  }

  if (reduced){
    bar.style.width = '100%';
    percentEl.textContent = '100%';
  } else {
    requestAnimationFrame(tick);
  }

  function finishLoading(){
    target = 100;
    if (reduced){
      completeAndHide();
      return;
    }
    const waitForFull = () => {
      if (progress >= 99.5){
        cancelAnimationFrame(rafId);
        completeAndHide();
      } else {
        requestAnimationFrame(waitForFull);
      }
    };
    waitForFull();
  }

  function completeAndHide(){
    bar.style.width = '100%';
    percentEl.textContent = '100%';
    loader.classList.add('done');
    document.body.style.overflow = '';
    setTimeout(() => loader.remove(), 750);
  }

  /* Demo only: simulate real asset loading with a short delay.
     In production, replace this whole block with:
         window.addEventListener('load', finishLoading);
  */
  setTimeout(finishLoading, 2200);
})();
</script>
</body>
</html>
